services:
  filtr:
    image: ${FILTR_IMAGE:-ghcr.io/kisa-ops/filtr:v4.1.4}
    container_name: filtr-app
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - ADMIN_MASTER_TOKEN=${ADMIN_MASTER_TOKEN:-}
      - PRESIDIO_ENABLED=${PRESIDIO_ENABLED:-false}
      - PRESIDIO_MODE=${PRESIDIO_MODE:-local}
      - PRESIDIO_URL=${PRESIDIO_URL:-http://presidio:5001}
      - PRESIDIO_CONFIDENCE_THRESHOLD=${PRESIDIO_CONFIDENCE_THRESHOLD:-0.6}
    volumes:
      - filtr-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      presidio:
        condition: service_started
        required: false

  # Optional AI/NER Sidecar (Pluggable Microsoft Presidio Analyzer)
  # Activated automatically when COMPOSE_PROFILES=ner or --profile ner is specified
  presidio:
    image: ${PRESIDIO_IMAGE:-mcr.microsoft.com/presidio-analyzer:latest}
    container_name: filtr-presidio
    restart: unless-stopped
    profiles:
      - ner
      - ai
    # Secure internal network isolation (zero host port exposure)
    expose:
      - "5001"
    environment:
      - PORT=5001
      - LOG_LEVEL=INFO
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  # Optional Zero-Leak AI Incident Analytics Platform (LogOps)
  # Activated automatically when COMPOSE_PROFILES=logops (or --profile logops) is specified
  logops:
    image: ${LOGOPS_IMAGE:-ghcr.io/kisa-ops/logops:latest}
    container_name: logops-platform
    restart: unless-stopped
    profiles:
      - logops
      - enterprise
      - all
    ports:
      - "${LOGOPS_PORT:-8888}:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8888
      - NODE_ENV=production
      - FILTR_URL=${FILTR_URL:-http://filtr:80}
      - LLM_URL=${LLM_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-deepseek-r1:8b}
    volumes:
      - logops-data:/app/server/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8888/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      filtr:
        condition: service_started

volumes:
  filtr-data:
    name: filtr-data
  logops-data:
    name: logops-data
