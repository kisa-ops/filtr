services:
  filtr:
    image: ${FILTR_IMAGE:-ghcr.io/kisa-ops/filtr:v1.3.0}
    container_name: filtr-app
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
