version: '3.8'

services:
  filtr:
    image: ${FILTR_IMAGE:-filtr:v1.0.0}
    container_name: filtr-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
